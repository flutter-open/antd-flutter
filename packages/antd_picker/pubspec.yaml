name: antd_picker
description: Ant Design picker, cascader, date and time pickers for Flutter, with wheel columns and antd-mobile v5 interaction.
version: 1.1.0
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design
  - picker

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  antd_theme: ^1.0.1
  antd_icons_flutter: ^1.0.0
  # 滚轮引擎（wheel_picker_engine / wheel_column_model）与
  # AntPickerView（ui display，通用滚轮视图，留 ui 不迁）依赖
  antd_flutter_ui: ^1.0.5
  material_ui: ^1.11.0
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
