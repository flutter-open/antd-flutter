name: antd_flutter_plus
description: Ant Design v6 Flutter components library. A Flutter implementation of Ant Design with Design Token system.
version: 1.0.4
homepage: https://flutter-open.github.io/antd-flutter/
repository: https://github.com/flutter-open/antd-flutter
issue_tracker: https://github.com/flutter-open/antd-flutter/issues

topics:
  - ui
  - components
  - design-system
  - ant-design

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # L2/L3 子包（发布后自动从 pub.dev 解析）
  antd_color: ^1.0.1
  antd_tokens: ^1.0.1
  antd_theme: ^1.0.2
  antd_icons_flutter: ^1.0.3
  antd_flutter_ui: ^1.0.6
  antd_qrcode: ^1.0.2
  antd_refresh: ^1.0.2
  antd_swipe_action: ^1.0.2
  antd_calendar: ^1.0.1
  antd_splitter: ^1.0.2
  antd_image_viewer: ^1.0.2
  antd_upload: ^1.0.2
  antd_picker: ^1.1.1
  antd_form: ^1.0.2
  antd_tree: ^1.0.2
  antd_carousel: ^1.0.2
  antd_masonry: ^1.0.2
  antd_floating: ^1.0.2
  antd_keyboard: ^1.0.2
  antd_table: ^1.0.2
  antd_transfer: ^1.0.1
  cached_network_image: ^4.0.7

  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
dev_dependencies:
  analyzer: ^8.0.0
  flutter_test:
    sdk: flutter
  device_preview: ^1.2.0
  flutter_lints: ^5.0.0
  vector_math: any
  path: any
flutter:
  uses-material-design: true
